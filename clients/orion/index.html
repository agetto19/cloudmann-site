<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0A101C">
<title>Orion Hub · Cloudmann Consulting</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M8.5 22.5h13a5.5 5.5 0 0 0 .6-10.97A7.5 7.5 0 0 0 8.1 13.2 4.65 4.65 0 0 0 8.5 22.5Z' fill='none' stroke='%2363D3C0' stroke-width='2'/%3E%3Cpath d='M13 27h10M16.5 22.5V27' stroke='%23E9A33C' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --night:#0A101C;--night-2:#111A2B;--night-3:#1E2A3F;
  --paper:#F1F3F7;--paper-2:#E8ECF3;--white:#FFF;
  --ink:#0D1522;--ink-2:#41506B;--muted:#8695AC;--muted-2:#5D6C87;
  --amber:#E9A33C;--amber-lo:#F7C87A;--amber-bg:#FFF6E6;--amber-ink:#8A5300;
  --aqua:#63D3C0;--aqua-bg:#E3F6F2;--aqua-ink:#0E5E52;
  --red-bg:#FDECEC;--red-ink:#9B2C2C;
  --line:#DCE1EA;--radius:6px;
  --shadow:0 1px 2px rgba(13,21,34,.06),0 4px 14px rgba(13,21,34,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","Public Sans",sans-serif;letter-spacing:-.02em;line-height:1.12;margin:0}
p{margin:0}
a{color:#16695D}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-2)}
[hidden]{display:none!important}

/* ---------- lock ---------- */
.lockscreen{min-height:100vh;background:var(--night);color:#EDF1F7;display:flex;flex-direction:column}
.lock-top{padding:22px 0;border-bottom:1px solid var(--night-3)}
.brand{display:inline-flex;align-items:center;gap:10px;color:#EDF1F7;text-decoration:none;font-family:"Bricolage Grotesque",sans-serif;font-size:17px}
.brand i{font-style:normal;color:var(--muted)}
.lock-body{flex:1;display:flex;align-items:center;padding:40px 0}
.lock-card{max-width:520px}
.lock-card h1{font-size:clamp(34px,6vw,52px);margin:12px 0 12px}
.lock-card h1 em{font-style:normal;color:var(--amber)}
.lock-card p{color:#B8C3D4}
.lock-form{margin-top:26px;background:var(--night-2);border:1px solid var(--night-3);border-radius:var(--radius);padding:22px}
.lock-form label.l{display:block;font-size:14px;color:#B8C3D4;margin-bottom:8px}
.pwrow{display:flex;gap:10px}
.pwrow input{flex:1;min-width:0;padding:12px 14px;font-size:16px;background:#0D1522;border:1px solid #33405A;color:#fff;border-radius:4px}
.lock-form .opts{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--muted)}
.err{color:#F28B82;font-size:14px;margin-top:10px;min-height:1.2em}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--amber);color:#20160A;border:0;font-weight:600;font-size:15px;padding:11px 18px;border-radius:4px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--amber-lo)}
.btn-sm{font-size:13.5px;padding:7px 12px}
.btn-line{background:var(--white);color:var(--ink);border:1px solid var(--line)}
.btn-line:hover{background:var(--paper)}
.btn svg{width:16px;height:16px;flex:none}

/* ---------- app chrome ---------- */
.appbar{background:var(--night);color:#EDF1F7;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--night-3)}
.appbar .wrap{display:flex;align-items:center;gap:18px;height:58px}
.appbar .who{font-size:13px;color:var(--muted);margin-left:auto;white-space:nowrap}
.tabs{background:var(--night);position:sticky;top:58px;z-index:19;border-bottom:1px solid var(--night-3)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:#AEB9CB;padding:12px 14px;font-size:14.5px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:#fff}
.tab[aria-selected=true]{color:#fff;border-bottom-color:var(--amber)}
.tab .count{font-family:"JetBrains Mono",monospace;font-size:11px;background:var(--night-3);color:#C9D3E2;border-radius:10px;padding:1px 7px;margin-left:6px}
main{padding:26px 0 70px}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.view-head h2{font-size:clamp(26px,4vw,34px)}
.view-head p{color:var(--ink-2);max-width:640px;margin-top:6px}

/* ---------- overview ---------- */
.hello{background:var(--night);color:#EDF1F7;border-radius:var(--radius);padding:30px;position:relative;overflow:hidden}
.hello h1{font-size:clamp(28px,4.4vw,42px);margin:8px 0 10px;max-width:760px}
.hello p{color:#B8C3D4;max-width:720px}
.hello .eyebrow{color:var(--aqua)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 26px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.stat:hover{border-color:#B9C3D3;box-shadow:var(--shadow)}
.stat b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:32px;line-height:1.1}
.stat span{font-size:13.5px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:start}
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.panel h3{font-size:21px;margin-bottom:6px}
.panel>p.sub{color:var(--ink-2);margin-bottom:14px}
.week-head{font-size:24px;margin:6px 0 8px}
.standouts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.timeline li:first-child{border-top:0}
.tl-date{text-align:center;background:var(--paper);border-radius:4px;padding:6px 4px;height:max-content}
.tl-date b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:22px;line-height:1}
.tl-date small{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.timeline h4{font-family:"Public Sans",sans-serif;font-size:15px;font-weight:600;letter-spacing:0}
.timeline p{font-size:14px;color:var(--ink-2)}
.rel{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--amber-ink)}
.note{display:flex;gap:10px;background:var(--aqua-bg);color:var(--aqua-ink);border-radius:var(--radius);padding:12px 14px;font-size:14px;margin-top:20px}
.note svg{flex:none;width:18px;height:18px;margin-top:2px}
.log{list-style:none;padding:0;margin:0}
.log li{padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;color:var(--ink-2)}
.log li:first-child{border-top:0}
.log b{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted-2);font-weight:500;display:block}

/* ---------- filters ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:16px}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:4px;padding:0 10px;background:var(--paper)}
.search svg{width:16px;height:16px;color:var(--muted-2);flex:none}
.search input{border:0;background:none;padding:9px 0;font-size:15px;width:100%;outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--white);border-radius:20px;padding:6px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:#B9C3D3}
.chip[aria-pressed=true]{background:var(--night);color:#fff;border-color:var(--night)}
select.sel{border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:14px;background:var(--white)}
.result-count{font-size:13.5px;color:var(--muted-2);margin:-4px 0 12px}

/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,box-shadow .15s,transform .15s;width:100%}
.card:hover{border-color:#B9C3D3;box-shadow:var(--shadow);transform:translateY(-1px)}
.card h4{font-size:18px}
.card .meta{font-size:13px;color:var(--muted-2)}
.card .idea{font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11.5px;font-weight:600;border-radius:3px;padding:2px 7px;background:var(--paper-2);color:var(--ink-2);white-space:nowrap}
.b-venue{background:#E8EEFB;color:#2A4A8C}.b-planner{background:#F2E9FA;color:#6A3591}.b-event{background:var(--amber-bg);color:var(--amber-ink)}
.b-new{background:var(--aqua);color:#08332C}.b-idea{background:var(--aqua-bg);color:var(--aqua-ink)}
.b-warn{background:var(--red-bg);color:var(--red-ink)}.b-ok{background:var(--aqua-bg);color:var(--aqua-ink)}
.b-mine{background:var(--night);color:#fff}
.fit{display:inline-flex;gap:3px;align-items:center;font-size:12px;color:var(--muted-2)}
.fit i{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block}
.fit i.on{background:var(--amber)}
.when{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted-2)}
.when.soon{color:var(--amber-ink);font-weight:500}
.empty{padding:40px;text-align:center;color:var(--muted-2);background:var(--white);border:1px dashed var(--line);border-radius:var(--radius)}

/* ---------- list rows (directory) ---------- */
.rows{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row:hover{background:#F8F9FC}
.row b{font-weight:600}
.row small{display:block;color:var(--muted-2);font-size:12.5px}
.row .cap{font-size:14px;color:var(--ink-2)}

/* ---------- calendar ---------- */
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.month{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:12px;min-height:120px}
.month.now{border-color:var(--amber);box-shadow:inset 0 3px 0 var(--amber)}
.month h4{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);margin-bottom:8px;display:flex;justify-content:space-between}
.evt{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid transparent;border-radius:4px;padding:7px 9px;margin-top:6px;font-size:13.5px;cursor:pointer;line-height:1.35}
.evt:hover{border-color:#B9C3D3;background:#fff}
.evt small{display:block;color:var(--muted-2);font-size:12px}
.evt.open{background:var(--amber-bg)}
.evt.mine{box-shadow:inset 3px 0 0 var(--aqua)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:-4px 0 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block}

/* ---------- toolkit ---------- */
.kit{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.kit .panel h3{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kv{list-style:none;padding:0;margin:0}
.kv li{padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.kv li:first-child{border-top:0}
.kv b{display:block}
.kv span{color:var(--ink-2)}
.kv .src{font-size:12.5px}
ol.q{padding-left:20px;margin:6px 0 0;color:var(--ink-2);font-size:14.5px}
ol.q li{margin:4px 0}
.starter{background:var(--paper);border-radius:4px;padding:12px;font-size:14px;white-space:pre-wrap;color:var(--ink);margin:8px 0}
.tabs-mini{display:flex;gap:6px;margin-bottom:6px}

/* ---------- drawer ---------- */
dialog.drawer{border:0;padding:0;margin:0 0 0 auto;height:100vh;max-height:100vh;width:min(640px,100vw);max-width:100vw;background:var(--white);color:var(--ink);box-shadow:-10px 0 40px rgba(0,0,0,.2)}
dialog.drawer::backdrop{background:rgba(10,16,28,.55)}
.dr-head{position:sticky;top:0;background:var(--white);border-bottom:1px solid var(--line);padding:18px 22px;display:flex;gap:12px;align-items:flex-start;z-index:2}
.dr-head h3{font-size:24px;margin-top:6px}
.dr-head .meta{font-size:13.5px;color:var(--muted-2);margin-top:4px}
.x{margin-left:auto;background:var(--paper);border:0;border-radius:50%;width:36px;height:36px;cursor:pointer;flex:none;font-size:20px;line-height:1}
.dr-body{padding:6px 22px 40px}
.sec{padding:18px 0;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec h5{font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);margin:0 0 10px;font-weight:500}
.sec p{color:var(--ink-2)}
.facts{list-style:none;padding:0;margin:0}
.facts li{padding:7px 0;border-top:1px dashed var(--line);font-size:14.5px;display:grid;grid-template-columns:130px 1fr;gap:12px}
.facts li:first-child{border-top:0}
.facts li>span:first-child{color:var(--muted-2);font-size:13px}
.reach{display:flex;flex-wrap:wrap;gap:8px}
.reach .btn-line{font-weight:500}
.msg{width:100%;min-height:200px;border:1px solid var(--line);border-radius:4px;padding:12px;font:15px/1.55 "Public Sans",sans-serif;resize:vertical;background:#FFFDF8}
.msg-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.blanks{font-size:13px;color:var(--amber-ink)}
.fu{list-style:none;padding:0;margin:8px 0 0}
.fu li{font-size:14px;color:var(--ink-2);padding:4px 0 4px 18px;position:relative}
.fu li:before{content:"";position:absolute;left:2px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.track{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.track button{border:1px solid var(--line);background:var(--white);border-radius:4px;padding:8px;font-size:13.5px;cursor:pointer}
.track button[aria-pressed=true]{background:var(--night);color:#fff;border-color:var(--night)}
textarea.mynote{width:100%;min-height:70px;margin-top:8px;border:1px solid var(--line);border-radius:4px;padding:10px;font:14px/1.5 "Public Sans",sans-serif}
.small{font-size:12.5px;color:var(--muted-2)}
.srcs a{display:inline-block;margin-right:12px;font-size:13.5px;word-break:break-all}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--night);color:#fff;padding:10px 16px;border-radius:4px;font-size:14px;opacity:0;transition:all .2s;z-index:100;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}

footer{padding:24px 0 40px;color:var(--muted-2);font-size:13px;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
footer button{background:none;border:0;color:var(--muted-2);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}

@media (max-width:900px){
  .grid2,.kit{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .months{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:600px){
  .wrap{padding:0 16px}
  .hello{padding:22px}
  .standouts{grid-template-columns:1fr}
  .months{grid-template-columns:1fr}
  .row{grid-template-columns:1fr auto}
  .row .hide-sm{display:none}
  .facts li{grid-template-columns:1fr;gap:2px}
  .appbar .who{display:none}
  dialog.drawer{width:100vw}
  .dr-head,.dr-body{padding-left:16px;padding-right:16px}
  .panel{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<!-- ============ LOCK ============ -->
<div class="lockscreen" id="lock">
  <div class="lock-top"><div class="wrap">
    <a class="brand" href="/"><svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M8.5 22.5h13a5.5 5.5 0 0 0 .6-10.97A7.5 7.5 0 0 0 8.1 13.2 4.65 4.65 0 0 0 8.5 22.5Z" stroke="#63D3C0" stroke-width="1.7" stroke-linejoin="round"/><path d="M13 27h10M16.5 22.5V27" stroke="#E9A33C" stroke-width="1.7" stroke-linecap="round"/></svg><b>Cloudmann <i>Consulting</i></b></a>
  </div></div>
  <div class="lock-body"><div class="wrap"><div class="lock-card">
    <p class="eyebrow" style="color:var(--aqua)">Private client hub</p>
    <h1>Orion · <em>where the work is</em></h1>
    <p>Venues, planners and galas worth knowing about, with what we found and where we found it.</p>
    <form class="lock-form" id="lockform" autocomplete="off">
      <label class="l" for="un">Username</label>
      <div class="pwrow" style="margin-bottom:12px"><input type="text" id="un" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <label class="l" for="pw">Password</label>
      <div class="pwrow"><input type="password" id="pw" autocomplete="current-password" required><button class="btn" type="submit">Sign in</button></div>
      <label class="opts"><input type="checkbox" id="remember" checked> Keep me signed in on this device</label>
      <div class="err" id="err" role="alert" aria-live="polite"></div>
    </form>
  </div></div></div>
</div>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <div class="appbar"><div class="wrap">
    <a class="brand" href="/"><svg width="24" height="24" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M8.5 22.5h13a5.5 5.5 0 0 0 .6-10.97A7.5 7.5 0 0 0 8.1 13.2 4.65 4.65 0 0 0 8.5 22.5Z" stroke="#63D3C0" stroke-width="1.7" stroke-linejoin="round"/><path d="M13 27h10M16.5 22.5V27" stroke="#E9A33C" stroke-width="1.7" stroke-linecap="round"/></svg><b>Orion <i>Hub</i></b></a>
    <span class="who" id="updated"></span>
  </div></div>
  <nav class="tabs" aria-label="Sections"><div class="wrap" role="tablist" id="tabs"></div></nav>
  <main><div class="wrap" id="view"></div></main>
  <footer><div class="wrap"><span>Prepared by Cloudmann Consulting · Confidential</span><span><button id="signout">Sign out</button></span></div></footer>
</div>

<dialog class="drawer" id="drawer" aria-labelledby="dr-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ---------- unlock ---------- */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sha256hex(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
async function decrypt(un,pw){
  un=un.trim().toLowerCase();
  const h=await sha256hex("orion-hub:"+un), u=PAYLOAD.u.find(x=>x.h===h);
  if(!u)throw new Error("no user");
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(un+":"+pw),"PBKDF2",false,["deriveKey"]);
  const kek=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(u.s),iterations:PAYLOAD.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const dkRaw=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(u.i)},kek,b64(u.k));
  const dk=await crypto.subtle.importKey("raw",dkRaw,"AES-GCM",false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(PAYLOAD.i)},dk,b64(PAYLOAD.c))));
}

async function tryLogin(un,pw,silent){
  try{const d=await decrypt(un,pw);WHO=un.trim();start(d);return true;}
  catch(e){if(!silent)$("#err").textContent="That username and password didn't match. Check both and try again.";return false;}
}

/* ============ OPPORTUNITIES ============ */
function cardHTML(l){
  const d=D.content.drafts[l.id], mine=T[l.id]&&T[l.id].s, wk=new Date(today()-7*864e5).toISOString().slice(0,10);
  const soon=l.date&&l.date<=new Date(+today()+7*864e5).toISOString().slice(0,10);
  return `<button class="card" data-lead="${esc(l.id)}">
    <div class="badges"><span class="badge b-${l.type}">${TYPE[l.type]||l.type}</span>${l.added>=wk?'<span class="badge b-new">New</span>':""}${d?'<span class="badge b-idea">Message idea</span>':""}${mine?`<span class="badge b-mine">${esc(stLabel(mine))}</span>`:""}</div>
    <h4>${esc(l.name)}</h4>
    <div class="meta">${esc(l.city)} · ${REGION[l.region]||l.region}</div>
    <p class="idea">${esc(d?d.angle:(l.idea||l.facts))}</p>
    <div class="foot">${fitDots(l.score)}<span class="when ${soon?"soon":""}">${l.date?"Suggested "+fmtDate(l.date):""}</span></div>
  </button>`;
}
function bindCards(){$("#view").querySelectorAll("[data-lead]").forEach(c=>c.onclick=()=>go("opps",c.dataset.lead));}
function chipRow(name,opts,cur){return `<div class="chips" data-f="${name}">${opts.map(([v,l])=>`<button class="chip" data-v="${v}" aria-pressed="${String(cur)===String(v)}">${l}</button>`).join("")}</div>`;}
function vOpps(){
  const f=S.opp;
  $("#view").innerHTML=`
  <div class="view-head"><div><h2>Opportunities</h2><p>Venues, planners and galas that look like a good fit for big weddings and high-profile events. Tap one for what we know, how to reach them, and a message idea you can edit.</p></div></div>
  <div class="toolbar">
    <label class="search">${icon.search}<input id="q" type="search" placeholder="Search names, towns, details…" value="${esc(f.q)}" aria-label="Search opportunities"></label>
    ${chipRow("type",[["all","All"],["venue","Venues"],["planner","Planners"],["event","Galas"]],f.type)}
    <select class="sel" id="region" aria-label="Region"><option value="all">All regions</option>${Object.entries(REGION).map(([k,v])=>`<option value="${k}" ${f.region===k?"selected":""}>${v}</option>`).join("")}</select>
    <button class="chip" id="ideaT" aria-pressed="${f.idea}">Message idea ready</button>
    <select class="sel" id="sort" aria-label="Sort"><option value="soon" ${f.sort==="soon"?"selected":""}>Soonest first</option><option value="fit" ${f.sort==="fit"?"selected":""}>Best fit first</option><option value="name" ${f.sort==="name"?"selected":""}>A–Z</option></select>
  </div>
  <p class="result-count" id="rc"></p>
  <div class="cards" id="cards"></div>`;
  const draw=()=>{
    const q=f.q.toLowerCase();
    let L=D.leads.filter(l=>(f.type==="all"||l.type===f.type)&&(f.region==="all"||l.region===f.region)&&(!f.idea||D.content.drafts[l.id])&&(!q||(l.name+" "+l.city+" "+l.facts+" "+(REGION[l.region]||"")).toLowerCase().includes(q)));
    L.sort(f.sort==="fit"?(a,b)=>b.score-a.score||a.name.localeCompare(b.name):f.sort==="name"?(a,b)=>a.name.localeCompare(b.name):(a,b)=>(a.date||"9").localeCompare(b.date||"9")||b.score-a.score);
    $("#rc").textContent=`${L.length} of ${D.leads.length} shown`;
    $("#cards").innerHTML=L.length?L.map(cardHTML).join(""):`<div class="empty">Nothing matches. Try clearing a filter.</div>`;
    bindCards();
  };
  $("#q").oninput=e=>{f.q=e.target.value;draw();};
  $("#region").onchange=e=>{f.region=e.target.value;draw();};
  $("#sort").onchange=e=>{f.sort=e.target.value;draw();};
  $("#ideaT").onclick=e=>{f.idea=!f.idea;e.target.setAttribute("aria-pressed",f.idea);draw();};
  $("#view").querySelector('[data-f="type"]').onclick=e=>{const b=e.target.closest(".chip");if(!b)return;f.type=b.dataset.v;e.currentTarget.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));draw();};
  draw();
}

/* ---------- drawer content ---------- */
function reachHTML(c,extraSite){
  if(!c)return"";
  const parts=[];
  c.emails.forEach(e=>parts.push(`<a class="btn btn-line btn-sm" href="mailto:${esc(e)}">${icon.mail}${esc(e)}</a>`));
  c.phones.forEach(p=>parts.push(`<a class="btn btn-line btn-sm" href="tel:${esc(p.replace(/[^\d+]/g,""))}">${icon.phone}${esc(p)}</a>`));
  c.ig.forEach(h=>parts.push(`<a class="btn btn-line btn-sm" href="https://www.instagram.com/${esc(h.slice(1))}/" target="_blank" rel="noopener">${icon.ig}${esc(h)}</a>`));
  c.urls.forEach(u=>parts.push(`<a class="btn btn-line btn-sm" href="${esc(u)}" target="_blank" rel="noopener">${icon.web}${esc(/contact|form|inquir/i.test(u)?"Contact form":"Website")}</a>`));
  if(extraSite&&/^https?:/.test(extraSite)&&!c.urls.includes(extraSite))parts.push(`<a class="btn btn-line btn-sm" href="${esc(extraSite)}" target="_blank" rel="noopener">${icon.web}Website</a>`);
  const raw=parts.length?(/form/i.test(c.raw)&&!c.urls.length?`<p class="small" style="margin-top:8px">${esc(c.raw)}</p>`:""):(c.raw&&!/^not found/i.test(c.raw)?`<p class="small" style="margin-top:8px">${esc(c.raw)}</p>`:`<p class="small" style="margin-top:8px">No public contact found yet. Their website is the place to check.</p>`);
  return `<div class="reach">${parts.join("")}</div>${raw}`;
}
function trackerHTML(id){
  const t=T[id]||{};
  return `<div class="sec"><h5>My notes · saved on this device only</h5>
    <div class="track" data-track="${esc(id)}">${STATUSES.map(([k,l])=>`<button data-s="${k}" aria-pressed="${(t.s||"")===k}">${l}</button>`).join("")}</div>
    <textarea class="mynote" data-note="${esc(id)}" placeholder="Notes: who you talked to, what they said, dates…">${esc(t.n||"")}</textarea></div>`;
}
function bindTracker(name){
  const dr=$("#drawer");
  dr.querySelectorAll("[data-track]").forEach(box=>box.onclick=e=>{const b=e.target.closest("button");if(!b)return;const id=box.dataset.track;T[id]=T[id]||{};T[id].s=b.dataset.s;T[id].name=name;T[id].at=new Date().toISOString().slice(0,10);saveT();box.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));toast(b.dataset.s?"Saved: "+stLabel(b.dataset.s):"Cleared");buildTabs();});
  dr.querySelectorAll("[data-note]").forEach(ta=>ta.oninput=()=>{const id=ta.dataset.note;T[id]=T[id]||{};T[id].n=ta.value;T[id].name=name;saveT();});
}
function drawer(html){const dr=$("#drawer");dr.innerHTML=html;if(!dr.open)dr.showModal();dr.scrollTop=0;
  dr.querySelector(".x").onclick=()=>closeDrawer();}
function closeDrawer(){const dr=$("#drawer");if(dr.open)dr.close();}
$("#drawer").addEventListener("close",()=>{if(location.hash.split("/").length>2)history.replaceState(null,"",`#/${S.tab}`);});
$("#drawer").addEventListener("click",e=>{if(e.target.id==="drawer")closeDrawer();});

function openItem(tab,id){
  if(tab==="opps"||tab==="overview"||tab==="mine"){const l=leadById(id);if(l)return openLead(l);}
  if(tab==="calendar"){const e=D.events.find(x=>x.id===id);if(e)return openEvent(e);}
  if(tab==="directory"){const v=D.venues.find(x=>x.id===id);if(v)return openVenue(v);const p=D.planners.find(x=>x.id===id);if(p)return openPlanner(p);}
}
function openLead(l){
  const d=D.content.drafts[l.id], t=T[l.id]||{};
  const dirV=D.venues.find(v=>v.id===l.id), dirP=D.planners.find(p=>p.id===l.id), dirE=D.events.find(e=>e.id===eventBase(l.id));
  const msg=t.m!=null?t.m:(d?d.message:(D.content.toolkit.starters[l.type]||""));
  const facts=[["Where",`${l.city} · ${REGION[l.region]||l.region}`]];
  if(dirV){if(dirV.seated&&!/^not found$/i.test(dirV.seated))facts.push(["Seated",dirV.seated]);if(dirV.standing&&!/^not found$/i.test(dirV.standing))facts.push(["Standing",dirV.standing]);if(dirV.policy&&dirV.policy!=="unknown")facts.push(["Vendor policy",dirV.policy]);if(dirV.dj&&!/^not found$/i.test(dirV.dj))facts.push(["DJ notes",dirV.dj]);}
  if(dirP){facts.push(["Serves",dirP.area]);if(dirP.specialties&&dirP.specialties!=="Not found")facts.push(["Specialties",dirP.specialties]);if(dirP.venues&&dirP.venues!=="Not found")facts.push(["Venues they work",dirP.venues]);if(dirP.price&&dirP.price!=="Not found")facts.push(["Their pricing",dirP.price]);}
  if(dirE){facts.push(["Last edition",dirE.last]);if(dirE.size&&dirE.size!=="Not found")facts.push(["Size",dirE.size]);facts.push(["Music so far",dirE.music]);}
  if(l.facts)facts.push(["What we found",l.facts]);
  const idea=d?d.angle:l.idea;
  drawer(`
    <div class="dr-head"><div><div class="badges"><span class="badge b-${l.type}">${TYPE[l.type]}</span>${d?'<span class="badge b-idea">Message idea</span>':""}</div><h3 id="dr-title">${esc(l.name)}</h3><div class="meta">${fitDots(l.score)} &nbsp;·&nbsp; ${l.date?"Suggested timing: "+fmtDate(l.date)+" ("+relDays(l.date)+")":""}</div></div><button class="x" aria-label="Close">×</button></div>
    <div class="dr-body">
      ${idea?`<div class="sec"><h5>Why it could be worth it</h5><p>${esc(idea)}</p></div>`:`<div class="sec"><h5>An idea</h5><p>${esc(words(l.next))}</p></div>`}
      <div class="sec"><h5>What we know</h5><ul class="facts">${facts.map(([k,v])=>`<li><span>${esc(k)}</span><span>${esc(v)}</span></li>`).join("")}</ul>
        <p class="srcs" style="margin-top:10px"><span class="small">Sources: </span>${srcLinks([l.source].concat(dirV?dirV.sources:dirP?dirP.sources:dirE?dirE.sources:[]).filter((u,i,a)=>a.indexOf(u)===i))}</p></div>
      <div class="sec"><h5>How to reach them</h5>${d?`<p class="small" style="margin-bottom:8px">Best channel we found: ${esc(d.channel)}</p>`:""}${reachHTML(l.contact,dirV&&dirV.site||dirP&&dirP.site)}</div>
      <div class="sec"><h5>${d?"A message idea, in your voice":"A starting point to make your own"}</h5>
        <p class="small" style="margin-bottom:8px">Edit freely. Your changes are saved on this device. Anything in [brackets] is a blank for you to fill in.</p>
        <textarea class="msg" id="msg">${esc(msg)}</textarea>
        <div class="msg-tools"><button class="btn btn-sm" id="cp">${icon.copy}Copy</button>${l.contact.emails[0]?`<a class="btn btn-line btn-sm" id="em" href="#">${icon.mail}Open in email</a>`:""}<button class="btn btn-line btn-sm" id="rs">Reset</button><span class="blanks" id="bl"></span></div>
        ${d&&d.followups?`<p class="small" style="margin-top:14px">If you don't hear back, some ideas:</p><ul class="fu">${d.followups.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
      </div>
      ${l.type==="venue"?`<div class="sec"><h5>Questions worth asking a venue</h5><ol class="q">${D.content.toolkit.venue_questions.map(q=>`<li>${esc(q)}</li>`).join("")}</ol></div>`:""}
      ${trackerHTML(l.id)}
    </div>`);
  const ta=$("#msg"), bl=()=>{const n=(ta.value.match(/\[[^\]]+\]/g)||[]).length;$("#bl").textContent=n?`${n} blank${n>1?"s":""} to fill`:"";};
  bl();
  ta.oninput=()=>{T[l.id]=T[l.id]||{};T[l.id].m=ta.value;T[l.id].name=l.name;saveT();bl();};
  $("#cp").onclick=()=>copy(ta.value,"Message copied");
  $("#rs").onclick=()=>{if(T[l.id])delete T[l.id].m;saveT();ta.value=d?d.message:(D.content.toolkit.starters[l.type]||"");bl();};
  const em=$("#em");if(em)em.onclick=e=>{e.preventDefault();let body=ta.value,subj="";const m=body.match(/^Subject:\s*(.+)\n+/);if(m){subj=m[1];body=body.slice(m[0].length);}location.href=`mailto:${l.contact.emails[0]}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;};
  bindTracker(l.name);
}

/* ============ CALENDAR ============ */
function monthIdx(e){
  const src=(e.month||"")+" ";
  for(let i=0;i<12;i++){if(new RegExp("\\b"+MON3[i],"i").test(src))return i;}
  const m=(e.last||"").match(/^(20\d\d)-(\d\d)/);return m?+m[2]-1:-1;
}
function windowOpen(e){const w=(e.window||"").toLowerCase();return /\bnow\b|open now|nov 2026|oct 2026-|sep-dec 2026|now-dec 2026/.test(w)&&!/passed/.test(w);}
function vCalendar(){
  const f=S.cal, nowM=today().getMonth();
  $("#view").innerHTML=`
  <div class="view-head"><div><h2>Gala calendar</h2><p>Galas and benefit events that usually have dancing or a DJ, placed in the month they normally happen. Organizers tend to line up entertainment months ahead, so each one shows when reaching out has worked best.</p></div></div>
  <div class="toolbar">
    <select class="sel" id="cr" aria-label="Region"><option value="all">All regions</option>${Object.entries(REGION).map(([k,v])=>`<option value="${k}" ${f.region===k?"selected":""}>${v}</option>`).join("")}</select>
    <button class="chip" id="ow" aria-pressed="${f.open}">Good time to reach out now</button>
  </div>
  <div class="legend"><span><i class="sw" style="background:var(--amber-bg);border:1px solid var(--amber)"></i>Good time to reach out now</span><span><i class="sw" style="background:var(--paper);box-shadow:inset 3px 0 0 var(--aqua)"></i>Also in your opportunities</span><span><i class="sw" style="border:2px solid var(--amber)"></i>This month</span></div>
  <div class="months" id="months"></div>`;
  const draw=()=>{
    const E=D.events.filter(e=>(f.region==="all"||e.region===f.region)&&(!f.open||windowOpen(e)));
    const buckets=Array.from({length:13},()=>[]);E.forEach(e=>{const i=monthIdx(e);buckets[i<0?12:i].push(e);});
    const order=[...Array(12).keys()].map(i=>(i+nowM)%12).concat([12]);
    $("#months").innerHTML=order.map(i=>{const list=buckets[i];if(i===12&&!list.length)return"";
      return `<div class="month ${i===nowM?"now":""}"><h4><span>${i===12?"Date not confirmed":MONTHS[i]}</span><span>${list.length||""}</span></h4>${list.length?list.map(e=>`<button class="evt ${windowOpen(e)?"open":""} ${leadForEvent(e.id)?"mine":""}" data-ev="${esc(e.id)}">${esc(e.name)}<small>${esc(REGION[e.region]||e.region)}${e.outdated?" · older info":""}</small></button>`).join(""):'<p class="small">Nothing found yet</p>'}</div>`;}).join("");
    $("#months").querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>go("calendar",b.dataset.ev));
  };
  $("#cr").onchange=e=>{f.region=e.target.value;draw();};
  $("#ow").onclick=e=>{f.open=!f.open;e.target.setAttribute("aria-pressed",f.open);draw();};
  draw();
}
function openEvent(e){
  const lead=leadForEvent(e.id);
  const facts=[["Organizer",e.org],["Usually",e.month],["Last edition",e.last],["Size",e.size],["Music so far",e.music],["When to reach out",words(e.window)]].filter(([,v])=>v&&!/^not found$/i.test(v));
  drawer(`
    <div class="dr-head"><div><div class="badges"><span class="badge b-event">Gala</span>${windowOpen(e)?'<span class="badge b-new">Good time now</span>':""}${e.outdated?'<span class="badge b-warn">Older info, check before relying on it</span>':""}</div><h3 id="dr-title">${esc(e.name)}</h3><div class="meta">${esc(REGION[e.region]||e.region)} · checked ${fmtDate(e.checked)}</div></div><button class="x" aria-label="Close">×</button></div>
    <div class="dr-body">
      <div class="sec"><h5>What we know</h5><ul class="facts">${facts.map(([k,v])=>`<li><span>${esc(k)}</span><span>${esc(v)}</span></li>`).join("")}</ul>${e.notes?`<p class="small" style="margin-top:10px">${esc(e.notes)}</p>`:""}<p class="srcs" style="margin-top:10px"><span class="small">Sources: </span>${srcLinks(e.sources)}</p></div>
      <div class="sec"><h5>How to reach them</h5>${reachHTML(e.contact)}</div>
      ${lead?`<div class="sec"><h5>In your opportunities</h5><p>This one has a full write-up${D.content.drafts[lead.id]?" and a message idea":""}.</p><button class="btn btn-sm" style="margin-top:10px" id="toLead">Open the opportunity</button></div>`:`<div class="sec"><h5>A starting point</h5><div class="starter">${esc(D.content.toolkit.starters.event)}</div><button class="btn btn-line btn-sm" id="cpS">${icon.copy}Copy</button></div>`}
      ${trackerHTML(e.id)}
    </div>`);
  const tl=$("#toLead");if(tl)tl.onclick=()=>go("opps",lead.id);
  const cs=$("#cpS");if(cs)cs.onclick=()=>copy(D.content.toolkit.starters.event,"Copied");
  bindTracker(e.name);
}

/* ============ DIRECTORY ============ */
function vDirectory(){
  const f=S.dir;
  $("#view").innerHTML=`
  <div class="view-head"><div><h2>Venues & planners</h2><p>The wider map: every venue and planner we've looked at in your area, with what each one publishes about size, vendor rules and contacts. Details from a business's own site are marked as such. Anything from a listing site is worth double-checking.</p></div></div>
  <div class="toolbar">
    ${chipRow("kind",[["venues",`Venues (${D.venues.length})`],["planners",`Planners (${D.planners.length})`]],f.kind)}
    <label class="search">${icon.search}<input id="dq" type="search" placeholder="Search…" value="${esc(f.q)}" aria-label="Search directory"></label>
    <select class="sel" id="dr" aria-label="Region"><option value="all">All regions</option>${Object.entries(REGION).map(([k,v])=>`<option value="${k}" ${f.region===k?"selected":""}>${v}</option>`).join("")}</select>
    <select class="sel" id="dc" aria-label="Capacity" ${f.kind!=="venues"?"hidden":""}><option value="0">Any size</option><option value="150" ${f.cap==150?"selected":""}>150+ guests</option><option value="250" ${f.cap==250?"selected":""}>250+ guests</option><option value="500" ${f.cap==500?"selected":""}>500+ guests</option></select>
    <button class="chip" id="fp" aria-pressed="${f.firstParty}">From their own site only</button>
  </div>
  <p class="result-count" id="drc"></p>
  <div class="rows" id="rows"></div>`;
  const draw=()=>{
    const q=f.q.toLowerCase();let html="",n=0,tot=0;
    if(f.kind==="venues"){
      const V=D.venues.filter(v=>(f.region==="all"||v.region===f.region)&&(!f.cap||(v.cap||0)>=f.cap)&&(!f.firstParty||v.evidence==="first-party")&&(!q||(v.name+" "+v.city+" "+v.kind+" "+v.policy+" "+v.notes).toLowerCase().includes(q))).sort((a,b)=>(b.cap||0)-(a.cap||0));
      n=V.length;tot=D.venues.length;
      html=V.map(v=>`<button class="row" data-dv="${esc(v.id)}"><span><b>${esc(v.name)}</b><small>${esc(v.city)} · ${REGION[v.region]||v.region} · ${esc(v.kind)}</small></span><span class="cap hide-sm">${v.cap?`Up to ~${v.cap.toLocaleString()}`:"Size not found"}</span><span class="hide-sm">${v.policy&&v.policy!=="unknown"?`<span class="badge b-ok">Vendor policy published</span>`:`<span class="small">Vendor policy not published</span>`}</span><span>${v.evidence==="first-party"?'<span class="badge b-ok">Own site</span>':'<span class="badge b-warn">Listing site</span>'}${leadForDir(v.id)?' <span class="badge b-idea">Opportunity</span>':""}</span></button>`).join("");
    }else{
      const P=D.planners.filter(p=>(f.region==="all"||p.regions.includes(f.region))&&(!f.firstParty||p.evidence==="first-party")&&(!q||(p.name+" "+p.city+" "+p.area+" "+p.specialties).toLowerCase().includes(q))).sort((a,b)=>(a.inactive-b.inactive)||a.name.localeCompare(b.name));
      n=P.length;tot=D.planners.length;
      html=P.map(p=>`<button class="row" data-dp="${esc(p.id)}"><span><b>${esc(p.name)}</b><small>${esc(p.city)} · ${esc(p.regions.map(r=>REGION[r]||r).join(", "))}</small></span><span class="cap hide-sm">${esc(p.specialties)}</span><span class="hide-sm">${p.ig&&p.ig!=="Not found"?`<span class="small">${esc(p.ig.split(" ")[0])}</span>`:""}</span><span>${p.inactive?'<span class="badge b-warn">May be inactive</span>':p.evidence==="first-party"?'<span class="badge b-ok">Own site</span>':'<span class="badge b-warn">Listing site</span>'}${leadForDir(p.id)?' <span class="badge b-idea">Opportunity</span>':""}</span></button>`).join("");
    }
    $("#drc").textContent=`${n} of ${tot} shown`;
    $("#rows").innerHTML=html||`<div class="empty">Nothing matches. Try clearing a filter.</div>`;
    $("#rows").querySelectorAll("[data-dv],[data-dp]").forEach(b=>b.onclick=()=>go("directory",b.dataset.dv||b.dataset.dp));
  };
  $("#view").querySelector('[data-f="kind"]').onclick=e=>{const b=e.target.closest(".chip");if(!b)return;f.kind=b.dataset.v;vDirectory();};
  $("#dq").oninput=e=>{f.q=e.target.value;draw();};
  $("#dr").onchange=e=>{f.region=e.target.value;draw();};
  $("#dc").onchange=e=>{f.cap=+e.target.value;draw();};
  $("#fp").onclick=e=>{f.firstParty=!f.firstParty;e.target.setAttribute("aria-pressed",f.firstParty);draw();};
  draw();
}
function evBadge(ev,checked){return (ev==="first-party"?'<span class="badge b-ok">From their own site</span>':'<span class="badge b-warn">From a listing site, worth confirming</span>')+` <span class="small">checked ${fmtDate(checked)}</span>`;}
function openVenue(v){
  const lead=leadForDir(v.id);
  const facts=[["Type",v.kind],["Seated",v.seated],["Standing",v.standing],["Setting",v.setting],["Vendor policy",v.policy],["DJ notes",v.dj],["Good to know",v.culture]].filter(([,x])=>x&&!/^(not found|unknown)$/i.test(x));
  drawer(`<div class="dr-head"><div><div class="badges"><span class="badge b-venue">Venue</span>${v.status==="borderline"?'<span class="badge">May be under 150 guests</span>':""}</div><h3 id="dr-title">${esc(v.name)}</h3><div class="meta">${esc(v.city)} · ${REGION[v.region]||v.region}</div></div><button class="x" aria-label="Close">×</button></div>
  <div class="dr-body"><div class="sec"><h5>What they publish</h5><p style="margin-bottom:10px">${evBadge(v.evidence,v.checked)}</p><ul class="facts">${facts.map(([k,x])=>`<li><span>${esc(k)}</span><span>${esc(x)}</span></li>`).join("")}</ul>${v.notes?`<p class="small" style="margin-top:10px">${esc(v.notes)}</p>`:""}<p class="srcs" style="margin-top:10px"><span class="small">Sources: </span>${srcLinks(v.sources)}</p></div>
  <div class="sec"><h5>How to reach them</h5>${reachHTML(v.contact,v.site)}</div>
  ${lead?`<div class="sec"><h5>In your opportunities</h5><button class="btn btn-sm" id="toLead">Open the opportunity</button></div>`:`<div class="sec"><h5>A starting point</h5><div class="starter">${esc(D.content.toolkit.starters.venue)}</div><button class="btn btn-line btn-sm" id="cpS">${icon.copy}Copy</button></div>`}
  <div class="sec"><h5>Questions worth asking</h5><ol class="q">${D.content.toolkit.venue_questions.map(q=>`<li>${esc(q)}</li>`).join("")}</ol></div>
  ${trackerHTML(v.id)}</div>`);
  const tl=$("#toLead");if(tl)tl.onclick=()=>go("opps",lead.id);
  const cs=$("#cpS");if(cs)cs.onclick=()=>copy(D.content.toolkit.starters.venue,"Copied");
  bindTracker(v.name);
}
function openPlanner(p){
  const lead=leadForDir(p.id);
  const facts=[["Based in",p.city],["Serves",p.area],["Specialties",p.specialties],["Their pricing",p.price],["Venues they show",p.venues],["Instagram",p.ig]].filter(([,x])=>x&&!/^(not found|unknown)$/i.test(x));
  drawer(`<div class="dr-head"><div><div class="badges"><span class="badge b-planner">Planner</span>${p.inactive?'<span class="badge b-warn">May be inactive</span>':""}</div><h3 id="dr-title">${esc(p.name)}</h3><div class="meta">${esc(p.regions.map(r=>REGION[r]||r).join(" · "))}</div></div><button class="x" aria-label="Close">×</button></div>
  <div class="dr-body"><div class="sec"><h5>What they publish</h5><p style="margin-bottom:10px">${evBadge(p.evidence,p.checked)}</p><ul class="facts">${facts.map(([k,x])=>`<li><span>${esc(k)}</span><span>${esc(x)}</span></li>`).join("")}</ul>${p.notes?`<p class="small" style="margin-top:10px">${esc(p.notes)}</p>`:""}<p class="srcs" style="margin-top:10px"><span class="small">Sources: </span>${srcLinks(p.sources)}</p></div>
  <div class="sec"><h5>How to reach them</h5>${reachHTML(p.contact,p.site)}</div>
  ${lead?`<div class="sec"><h5>In your opportunities</h5><button class="btn btn-sm" id="toLead">Open the opportunity</button></div>`:`<div class="sec"><h5>A starting point</h5><div class="starter">${esc(D.content.toolkit.starters.planner)}</div><button class="btn btn-line btn-sm" id="cpS">${icon.copy}Copy</button></div>`}
  ${trackerHTML(p.id)}</div>`);
  const tl=$("#toLead");if(tl)tl.onclick=()=>go("opps",lead.id);
  const cs=$("#cpS");if(cs)cs.onclick=()=>copy(D.content.toolkit.starters.planner,"Copied");
  bindTracker(p.name);
}

/* ============ TOOLKIT ============ */
function vToolkit(){
  const K=D.content.toolkit;
  const shows=D.content.timeline.filter(t=>/show|conference/i.test(t.title)&&t.date>=D.today);
  $("#view").innerHTML=`
  <div class="view-head"><div><h2>Toolkit</h2><p>Market info and reusable pieces: what others charge, where couples look, bridal shows, your own proof points, and message starters. Every number links to where it came from.</p></div></div>
  <div class="kit">
    <div class="panel"><h3>What others charge</h3><ul class="kv">${K.pricing.map(p=>`<li><b>${esc(p.what)}</b><span>${esc(p.who)}</span> · <a class="src" href="${esc(p.url)}" target="_blank" rel="noopener">source ↗</a></li>`).join("")}</ul><p class="small" style="margin-top:10px">${esc(K.pricing_note)}</p></div>
    <div class="panel"><h3>Where couples look</h3><ul class="kv">${K.marketplaces.map(m=>`<li><b>${esc(m.name)}</b><span>${esc(m.cost)}</span><br><span class="small">${esc(m.note)}</span> · <a class="src" href="${esc(m.url)}" target="_blank" rel="noopener">source ↗</a></li>`).join("")}</ul></div>
    <div class="panel"><h3>Bridal shows & industry dates</h3><ul class="timeline">${shows.map(t=>{const d=new Date(t.date+"T12:00:00");return `<li><div class="tl-date"><small>${MON3[d.getMonth()]}</small><b>${d.getDate()}</b></div><div><h4><a href="${esc(t.url)}" target="_blank" rel="noopener" style="color:inherit">${esc(t.title)}</a></h4><p>${esc(t.note)}</p><span class="rel">${relDays(t.date)}</span></div></li>`;}).join("")}</ul><p class="small" style="margin-top:10px">${esc(K.shows_note)}</p></div>
    <div class="panel"><h3>Your proof points</h3><p class="sub" style="color:var(--ink-2);margin-bottom:6px">Real moments from your own feed that work well in a message.</p><ul class="kv">${K.proof.map(p=>`<li><b>${esc(p.what)}</b><span>${esc(p.detail)}</span> <button class="btn btn-line btn-sm" style="margin-top:6px" data-cp="${esc(p.detail)}">${icon.copy}Copy</button> <a class="src" href="${esc(p.url)}" target="_blank" rel="noopener">post ↗</a></li>`).join("")}</ul></div>
    <div class="panel"><h3>People already in your corner</h3><ul class="kv">${K.partners.map(p=>`<li><b>${esc(p.who)}</b><span class="small">${esc(p.role)}</span><br><span>${esc(p.why)}</span></li>`).join("")}</ul></div>
    <div class="panel"><h3>Making it easy to book you</h3><ul class="kv">${K.credibility.map(c=>`<li><span>${esc(c)}</span></li>`).join("")}</ul></div>
    <div class="panel"><h3>Message starters <span class="tabs-mini" id="stTabs">${["venue","planner","event"].map((k,i)=>`<button class="chip" data-k="${k}" aria-pressed="${i===0}">${k==="event"?"Gala":TYPE[k]}</button>`).join("")}</span></h3><div class="starter" id="stText">${esc(K.starters.venue)}</div><button class="btn btn-sm" id="stCp">${icon.copy}Copy</button></div>
    <div class="panel"><h3>Questions for venues <button class="btn btn-line btn-sm" data-cp="${esc(K.venue_questions.map((q,i)=>`${i+1}. ${q}`).join("\n"))}">${icon.copy}Copy all</button></h3><ol class="q">${K.venue_questions.map(q=>`<li>${esc(q)}</li>`).join("")}</ol></div>
    <div class="panel" style="grid-column:1/-1"><h3>Questions to send a couple after they inquire <button class="btn btn-line btn-sm" data-cp="${esc(K.couple_questions.map((q,i)=>`${i+1}. ${q}`).join("\n"))}">${icon.copy}Copy all</button></h3><ol class="q">${K.couple_questions.map(q=>`<li>${esc(q)}</li>`).join("")}</ol></div>
  </div>`;
  $("#view").querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>copy(b.dataset.cp,"Copied"));
  let cur="venue";
  $("#stTabs").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;cur=b.dataset.k;$("#stText").textContent=K.starters[cur];$("#stTabs").querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));};
  $("#stCp").onclick=()=>copy(K.starters[cur],"Copied");
}

/* ============ MY LIST ============ */
function vMine(){
  const items=Object.entries(T).filter(([,v])=>v.s||v.n);
  const group=k=>items.filter(([,v])=>(v.s||"")===k);
  $("#view").innerHTML=`
  <div class="view-head"><div><h2>My list</h2><p>Anything you've marked or made notes on. This lives only in this browser on this device. To pass an update along, copy it and send it to Anthony. The weekly research then picks up where you are.</p></div><button class="btn" id="exp">${icon.copy}Copy an update for Anthony</button></div>
  ${items.length?STATUSES.filter(([k])=>k).concat([["","Notes only"]]).map(([k,l])=>{const g=group(k);if(!g.length)return"";return `<div class="panel" style="margin-bottom:14px"><h3>${l} <span class="small">${g.length}</span></h3><ul class="kv">${g.map(([id,v])=>`<li><a href="#" data-open="${esc(id)}"><b>${esc(v.name||id)}</b></a>${v.n?`<span>${esc(v.n)}</span>`:""}${v.at?` <span class="small">· ${fmtDate(v.at)}</span>`:""}</li>`).join("")}</ul></div>`;}).join(""):`<div class="empty">Nothing here yet. Open any opportunity, gala, venue or planner and use "My notes" at the bottom to mark it.</div>`}`;
  $("#exp").onclick=()=>{
    if(!items.length){toast("Nothing marked yet");return;}
    const lines=["Orion hub update – "+new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"}),""];
    STATUSES.filter(([k])=>k).forEach(([k,l])=>{const g=group(k);if(g.length){lines.push(l+":");g.forEach(([,v])=>lines.push(`- ${v.name}${v.n?" ("+v.n.replace(/\s+/g," ").trim()+")":""}`));lines.push("");}});
    copy(lines.join("\n").trim(),"Update copied, paste it into a text or email");
  };
  $("#view").querySelectorAll("[data-open]").forEach(a=>a.onclick=e=>{e.preventDefault();const id=a.dataset.open;
    if(leadById(id))go("opps",id);else if(D.events.find(x=>x.id===id))go("calendar",id);else go("directory",id);});
}
