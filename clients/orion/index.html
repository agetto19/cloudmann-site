<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0A101C">
<title>Orion Hub · Cloudmann Consulting</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M8.5 22.5h13a5.5 5.5 0 0 0 .6-10.97A7.5 7.5 0 0 0 8.1 13.2 4.65 4.65 0 0 0 8.5 22.5Z' fill='none' stroke='%2363D3C0' stroke-width='2'/%3E%3Cpath d='M13 27h10M16.5 22.5V27' stroke='%23E9A33C' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --night:#0A101C;--night-2:#111A2B;--night-3:#1E2A3F;
  --paper:#F1F3F7;--paper-2:#E8ECF3;--white:#FFF;
  --ink:#0D1522;--ink-2:#41506B;--muted:#8695AC;--muted-2:#5D6C87;
  --amber:#E9A33C;--amber-lo:#F7C87A;--amber-bg:#FFF6E6;--amber-ink:#8A5300;
  --aqua:#63D3C0;--aqua-bg:#E3F6F2;--aqua-ink:#0E5E52;
  --red-bg:#FDECEC;--red-ink:#9B2C2C;
  --line:#DCE1EA;--radius:6px;
  --shadow:0 1px 2px rgba(13,21,34,.06),0 4px 14px rgba(13,21,34,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","Public Sans",sans-serif;letter-spacing:-.02em;line-height:1.12;margin:0}
p{margin:0}
a{color:#16695D}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-2)}
[hidden]{display:none!important}

/* ---------- lock ---------- */
.lockscreen{min-height:100vh;background:var(--night);color:#EDF1F7;display:flex;flex-direction:column}
.lock-top{padding:22px 0;border-bottom:1px solid var(--night-3)}
.brand{display:inline-flex;align-items:center;gap:10px;color:#EDF1F7;text-decoration:none;font-family:"Bricolage Grotesque",sans-serif;font-size:17px}
.brand i{font-style:normal;color:var(--muted)}
.lock-body{flex:1;display:flex;align-items:center;padding:40px 0}
.lock-card{max-width:520px}
.lock-card h1{font-size:clamp(34px,6vw,52px);margin:12px 0 12px}
.lock-card h1 em{font-style:normal;color:var(--amber)}
.lock-card p{color:#B8C3D4}
.lock-form{margin-top:26px;background:var(--night-2);border:1px solid var(--night-3);border-radius:var(--radius);padding:22px}
.lock-form label.l{display:block;font-size:14px;color:#B8C3D4;margin-bottom:8px}
.pwrow{display:flex;gap:10px}
.pwrow input{flex:1;min-width:0;padding:12px 14px;font-size:16px;background:#0D1522;border:1px solid #33405A;color:#fff;border-radius:4px}
.lock-form .opts{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--muted)}
.err{color:#F28B82;font-size:14px;margin-top:10px;min-height:1.2em}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--amber);color:#20160A;border:0;font-weight:600;font-size:15px;padding:11px 18px;border-radius:4px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--amber-lo)}
.btn-sm{font-size:13.5px;padding:7px 12px}
.btn-line{background:var(--white);color:var(--ink);border:1px solid var(--line)}
.btn-line:hover{background:var(--paper)}
.btn svg{width:16px;height:16px;flex:none}

/* ---------- app chrome ---------- */
.appbar{background:var(--night);color:#EDF1F7;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--night-3)}
.appbar .wrap{display:flex;align-items:center;gap:18px;height:58px}
.appbar .who{font-size:13px;color:var(--muted);margin-left:auto;white-space:nowrap}
.tabs{background:var(--night);position:sticky;top:58px;z-index:19;border-bottom:1px solid var(--night-3)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:#AEB9CB;padding:12px 14px;font-size:14.5px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:#fff}
.tab[aria-selected=true]{color:#fff;border-bottom-color:var(--amber)}
.tab .count{font-family:"JetBrains Mono",monospace;font-size:11px;background:var(--night-3);color:#C9D3E2;border-radius:10px;padding:1px 7px;margin-left:6px}
main{padding:26px 0 70px}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.view-head h2{font-size:clamp(26px,4vw,34px)}
.view-head p{color:var(--ink-2);max-width:640px;margin-top:6px}

/* ---------- overview ---------- */
.hello{background:var(--night);color:#EDF1F7;border-radius:var(--radius);padding:30px;position:relative;overflow:hidden}
.hello h1{font-size:clamp(28px,4.4vw,42px);margin:8px 0 10px;max-width:760px}
.hello p{color:#B8C3D4;max-width:720px}
.hello .eyebrow{color:var(--aqua)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 26px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.stat:hover{border-color:#B9C3D3;box-shadow:var(--shadow)}
.stat b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:32px;line-height:1.1}
.stat span{font-size:13.5px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:start}
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.panel h3{font-size:21px;margin-bottom:6px}
.panel>p.sub{color:var(--ink-2);margin-bottom:14px}
.week-head{font-size:24px;margin:6px 0 8px}
.standouts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.timeline li:first-child{border-top:0}
.tl-date{text-align:center;background:var(--paper);border-radius:4px;padding:6px 4px;height:max-content}
.tl-date b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:22px;line-height:1}
.tl-date small{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.timeline h4{font-family:"Public Sans",sans-serif;font-size:15px;font-weight:600;letter-spacing:0}
.timeline p{font-size:14px;color:var(--ink-2)}
.rel{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--amber-ink)}
.note{display:flex;gap:10px;background:var(--aqua-bg);color:var(--aqua-ink);border-radius:var(--radius);padding:12px 14px;font-size:14px;margin-top:20px}
.note svg{flex:none;width:18px;height:18px;margin-top:2px}
.log{list-style:none;padding:0;margin:0}
.log li{padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;color:var(--ink-2)}
.log li:first-child{border-top:0}
.log b{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted-2);font-weight:500;display:block}

/* ---------- filters ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:16px}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:4px;padding:0 10px;background:var(--paper)}
.search svg{width:16px;height:16px;color:var(--muted-2);flex:none}
.search input{border:0;background:none;padding:9px 0;font-size:15px;width:100%;outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--white);border-radius:20px;padding:6px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:#B9C3D3}
.chip[aria-pressed=true]{background:var(--night);color:#fff;border-color:var(--night)}
select.sel{border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:14px;background:var(--white)}
.result-count{font-size:13.5px;color:var(--muted-2);margin:-4px 0 12px}

/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,box-shadow .15s,transform .15s;width:100%}
.card:hover{border-color:#B9C3D3;box-shadow:var(--shadow);transform:translateY(-1px)}
.card h4{font-size:18px}
.card .meta{font-size:13px;color:var(--muted-2)}
.card .idea{font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11.5px;font-weight:600;border-radius:3px;padding:2px 7px;background:var(--paper-2);color:var(--ink-2);white-space:nowrap}
.b-venue{background:#E8EEFB;color:#2A4A8C}.b-planner{background:#F2E9FA;color:#6A3591}.b-event{background:var(--amber-bg);color:var(--amber-ink)}
.b-new{background:var(--aqua);color:#08332C}.b-idea{background:var(--aqua-bg);color:var(--aqua-ink)}
.b-warn{background:var(--red-bg);color:var(--red-ink)}.b-ok{background:var(--aqua-bg);color:var(--aqua-ink)}
.b-mine{background:var(--night);color:#fff}
.fit{display:inline-flex;gap:3px;align-items:center;font-size:12px;color:var(--muted-2)}
.fit i{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block}
.fit i.on{background:var(--amber)}
.when{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted-2)}
.when.soon{color:var(--amber-ink);font-weight:500}
.empty{padding:40px;text-align:center;color:var(--muted-2);background:var(--white);border:1px dashed var(--line);border-radius:var(--radius)}

/* ---------- list rows (directory) ---------- */
.rows{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row:hover{background:#F8F9FC}
.row b{font-weight:600}
.row small{display:block;color:var(--muted-2);font-size:12.5px}
.row .cap{font-size:14px;color:var(--ink-2)}

/* ---------- calendar ---------- */
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.month{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:12px;min-height:120px}
.month.now{border-color:var(--amber);box-shadow:inset 0 3px 0 var(--amber)}
.month h4{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);margin-bottom:8px;display:flex;justify-content:space-between}
.evt{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid transparent;border-radius:4px;padding:7px 9px;margin-top:6px;font-size:13.5px;cursor:pointer;line-height:1.35}
.evt:hover{border-color:#B9C3D3;background:#fff}
.evt small{display:block;color:var(--muted-2);font-size:12px}
.evt.open{background:var(--amber-bg)}
.evt.mine{box-shadow:inset 3px 0 0 var(--aqua)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:-4px 0 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block}

/* ---------- toolkit ---------- */
.kit{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.kit .panel h3{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kv{list-style:none;padding:0;margin:0}
.kv li{padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.kv li:first-child{border-top:0}
.kv b{display:block}
.kv span{color:var(--ink-2)}
.kv .src{font-size:12.5px}
ol.q{padding-left:20px;margin:6px 0 0;color:var(--ink-2);font-size:14.5px}
ol.q li{margin:4px 0}
.starter{background:var(--paper);border-radius:4px;padding:12px;font-size:14px;white-space:pre-wrap;color:var(--ink);margin:8px 0}
.tabs-mini{display:flex;gap:6px;margin-bottom:6px}

/* ---------- drawer ---------- */
dialog.drawer{border:0;padding:0;margin:0 0 0 auto;height:100vh;max-height:100vh;width:min(640px,100vw);max-width:100vw;background:var(--white);color:var(--ink);box-shadow:-10px 0 40px rgba(0,0,0,.2)}
dialog.drawer::backdrop{background:rgba(10,16,28,.55)}
.dr-head{position:sticky;top:0;background:var(--white);border-bottom:1px solid var(--line);padding:18px 22px;display:flex;gap:12px;align-items:flex-start;z-index:2}
.dr-head h3{font-size:24px;margin-top:6px}
.dr-head .meta{font-size:13.5px;color:var(--muted-2);margin-top:4px}
.x{margin-left:auto;background:var(--paper);border:0;border-radius:50%;width:36px;height:36px;cursor:pointer;flex:none;font-size:20px;line-height:1}
.dr-body{padding:6px 22px 40px}
.sec{padding:18px 0;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec h5{font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);margin:0 0 10px;font-weight:500}
.sec p{color:var(--ink-2)}
.facts{list-style:none;padding:0;margin:0}
.facts li{padding:7px 0;border-top:1px dashed var(--line);font-size:14.5px;display:grid;grid-template-columns:130px 1fr;gap:12px}
.facts li:first-child{border-top:0}
.facts li>span:first-child{color:var(--muted-2);font-size:13px}
.reach{display:flex;flex-wrap:wrap;gap:8px}
.reach .btn-line{font-weight:500}
.msg{width:100%;min-height:200px;border:1px solid var(--line);border-radius:4px;padding:12px;font:15px/1.55 "Public Sans",sans-serif;resize:vertical;background:#FFFDF8}
.msg-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.blanks{font-size:13px;color:var(--amber-ink)}
.fu{list-style:none;padding:0;margin:8px 0 0}
.fu li{font-size:14px;color:var(--ink-2);padding:4px 0 4px 18px;position:relative}
.fu li:before{content:"";position:absolute;left:2px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.track{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.track button{border:1px solid var(--line);background:var(--white);border-radius:4px;padding:8px;font-size:13.5px;cursor:pointer}
.track button[aria-pressed=true]{background:var(--night);color:#fff;border-color:var(--night)}
textarea.mynote{width:100%;min-height:70px;margin-top:8px;border:1px solid var(--line);border-radius:4px;padding:10px;font:14px/1.5 "Public Sans",sans-serif}
.small{font-size:12.5px;color:var(--muted-2)}
.srcs a{display:inline-block;margin-right:12px;font-size:13.5px;word-break:break-all}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--night);color:#fff;padding:10px 16px;border-radius:4px;font-size:14px;opacity:0;transition:all .2s;z-index:100;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ---------- boutique + accordions ---------- */
.seg{display:inline-flex;background:var(--paper-2);border-radius:6px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;border-radius:4px;font-size:14px;font-weight:500;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--white);color:var(--ink);box-shadow:0 1px 2px rgba(13,21,34,.12)}
.acc{display:flex;flex-direction:column;gap:8px}
.acc-item{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.acc-item.open{border-color:#B9C3D3;box-shadow:var(--shadow)}
.acc-head{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;background:none;border:0;padding:14px 16px;text-align:left;cursor:pointer}
.acc-head:hover{background:#F8F9FC}
.acc-head b{font-family:"Bricolage Grotesque",sans-serif;font-size:17px;font-weight:600;letter-spacing:-.01em}
.acc-head .meta{font-size:13px;color:var(--muted-2);margin-top:2px}
.acc-head .badges{margin-top:6px}
.chev{width:28px;height:28px;border-radius:50%;background:var(--paper);display:grid;place-items:center;transition:transform .15s;flex:none}
.chev svg{width:14px;height:14px}
.acc-item.open .chev{transform:rotate(180deg)}
.acc-body{padding:0 16px 16px;border-top:1px solid var(--line)}
.acc-body .sec{padding:14px 0}
.b-conn{background:#E8EEFB;color:#2A4A8C}.b-list{background:var(--amber-bg);color:var(--amber-ink)}
.mini{list-style:none;padding:0;margin:0}
.mini li{font-size:14px;padding:5px 0;border-top:1px dashed var(--line);display:grid;grid-template-columns:120px 1fr;gap:10px}
.mini li:first-child{border-top:0}
.mini li>span:first-child{color:var(--muted-2);font-size:13px}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:4px 10px;font-size:13px;cursor:pointer}
.pchip:hover{border-color:#B9C3D3;background:#fff}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.steps li{counter-increment:s;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px 14px 52px;position:relative;font-size:15px;color:var(--ink-2)}
.steps li:before{content:counter(s);position:absolute;left:16px;top:13px;width:24px;height:24px;border-radius:50%;background:var(--night);color:#fff;font-size:13px;display:grid;place-items:center;font-weight:600}
.promo{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--amber-bg);border:1px solid #F3D9A8;border-radius:var(--radius);padding:14px 16px;margin:-10px 0 22px;flex-wrap:wrap}
.promo b{font-family:"Bricolage Grotesque",sans-serif;font-size:17px}
.promo span{color:var(--amber-ink);font-size:14px}
details.fold{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px}
details.fold>summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:"Bricolage Grotesque",sans-serif;font-size:18px;font-weight:600}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:after{content:"";width:9px;height:9px;border-right:2px solid var(--muted-2);border-bottom:2px solid var(--muted-2);transform:rotate(45deg);transition:transform .15s;flex:none;margin-right:4px}
details.fold[open]>summary:after{transform:rotate(-135deg)}
details.fold>summary small{font-family:"Public Sans",sans-serif;font-size:13px;font-weight:400;color:var(--muted-2);margin-left:auto;margin-right:10px}
details.fold>.fold-body{padding:0 18px 18px}
.linkbtn{background:none;border:0;color:#16695D;text-decoration:underline;cursor:pointer;font-size:14px;padding:6px 0 0}

.trk-extra{margin-top:10px;padding:10px 12px;background:var(--paper);border-radius:4px}
.trk-row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
input.dt,input.txt,.form input,.form textarea{border:1px solid var(--line);border-radius:4px;padding:8px 10px;font:14px "Public Sans",sans-serif;background:#fff;color:var(--ink)}
input.txt{display:block;width:100%;margin-top:6px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--ink-2)}
.form .msg-tools{grid-column:1/-1}
.fu-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.fu-row>span:first-child{display:flex;flex-direction:column;gap:2px}
.fu-btns{display:flex;gap:6px}
.sync{color:var(--aqua);margin-left:6px}
@media (max-width:600px){.form{grid-template-columns:1fr}}
footer{padding:24px 0 40px;color:var(--muted-2);font-size:13px;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
footer button{background:none;border:0;color:var(--muted-2);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}

@media (max-width:900px){
  .grid2,.kit{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .months{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:600px){
  .wrap{padding:0 16px}
  .hello{padding:22px}
  .standouts{grid-template-columns:1fr}
  .months{grid-template-columns:1fr}
  .row{grid-template-columns:1fr auto}
  .row .hide-sm{display:none}
  .facts li{grid-template-columns:1fr;gap:2px}
  .appbar .who{display:none}
  dialog.drawer{width:100vw}
  .dr-head,.dr-body{padding-left:16px;padding-right:16px}
  .panel{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sha256hex(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
async function decrypt(un,pw){
  un=un.trim().toLowerCase();
  const h=await sha256hex("orion-hub:"+un), u=PAYLOAD.u.find(x=>x.h===h);
  if(!u)throw new Error("no user");
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(un+":"+pw),"PBKDF2",false,["deriveKey"]);
  const kek=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(u.s),iterations:PAYLOAD.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const dkRaw=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(u.i)},kek,b64(u.k));
  const dk=await crypto.subtle.importKey("raw",dkRaw,"AES-GCM",false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(PAYLOAD.i)},dk,b64(PAYLOAD.c))));
}

async function sbUnlock(){

  const dk=await crypto.subtle.importKey("raw",b64(data.k),"AES-GCM",false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(PAYLOAD.i)},dk,b64(PAYLOAD.c))));
}

const TABS=[["overview","Overview"],["opps","Opportunities"],["boutique","Boutique venues"],["calendar","Gala calendar"],["directory","Venues & planners"],["toolkit","Toolkit"],["mine","My list"]];
function buildTabs(){
  const counts={opps:D.leads.length,boutique:(D.boutique&&D.boutique.venues.length)||0,calendar:D.events.length,directory:D.venues.length+D.planners.length,mine:Object.values(T).filter(x=>x.s).length};
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}${counts[k]!=null?`<span class="count">${counts[k]}</span>`:""}</button>`).join("");
  $("#tabs").onclick=e=>{const b=e.target.closest(".tab");if(b)go(b.dataset.tab);};
}
function go(tab,id){location.hash=id?`#/${tab}/${id}`:`#/${tab}`;}
function route(){
  const [,tab="overview",id]=(location.hash||"#/overview").split("/");
  S.tab=TABS.some(t=>t[0]===tab)?tab:"overview";
  buildTabs();
  if(S.tab==="boutique"){S.bq.open=id?decodeURIComponent(id):S.bq.open;if(id&&/^bp-/.test(S.bq.open))S.bq.view="planners";else if(id&&/^bv-/.test(S.bq.open))S.bq.view="venues";vBoutique();if($("#drawer").open)$("#drawer").close();return;}
  ({overview:vOverview,opps:vOpps,calendar:vCalendar,directory:vDirectory,toolkit:vToolkit,mine:vMine})[S.tab]();
  if(id){openItem(S.tab,decodeURIComponent(id));}else if($("#drawer").open){$("#drawer").close();}
}

  drawer(`

        ${d&&d.followups?`<p class="small" style="margin-top:14px">If you don't hear back, some ideas:</p><ul class="fu">${d.followups.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
      </div>
      ${l.type==="venue"?`<div class="sec"><h5>Questions worth asking a venue</h5><ol class="q">${D.content.toolkit.venue_questions.map(q=>`<li>${esc(q)}</li>`).join("")}</ol></div>`:""}

  bl();

  const em=$("#em");if(em)em.onclick=e=>{e.preventDefault();let body=ta.value,subj="";const m=body.match(/^Subject:\s*(.+)\n+/);if(m){subj=m[1];body=body.slice(m[0].length);}location.href=`mailto:${l.contact.emails[0]}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;};
  bindTracker(l.name);
}

function monthIdx(e){
  const src=(e.month||"")+" ";
  for(let i=0;i<12;i++){if(new RegExp("\\b"+MON3[i],"i").test(src))return i;}

          <p class="small" style="margin-top:8px">${v.evidence==="first-party"?"From their own site":v.evidence==="mixed"?"From their own site plus a listing site":"From a listing site, worth confirming"} · checked ${fmtDate(v.checked)}</p>
          <p class="srcs" style="margin-top:6px"><span class="small">Sources: </span>${srcLinks(v.sources)}</p></div>
        ${trackerHTML(v.id,v.name)}
      </div>`:""}</div>`;
  }
  function lookup(name){return `https://www.google.com/search?q=${encodeURIComponent(name+" Colorado wedding planner")}`;}
  function plannerItem(p){
    const open=f.open===p.id, vs=B.venues.filter(v=>v.planners.includes(p.id));
    const hasContact=p.contact.emails.length||p.contact.phones.length||p.contact.urls.length||p.contact.ig.length;
    const base=fillBlanks((BC.starters.planner||"").replace("[Planner]",p.name).replace("[venue]",vs[0]?vs[0].name:"[venue]"));
    bases[p.id]={text:base,name:p.name};
    const mine=T[p.id]&&T[p.id].s, inOpps=p.main&&leadById(p.main);
    return `<div class="acc-item ${open?"open":""}" id="it-${esc(p.id)}">
      <button class="acc-head" data-acc="${esc(p.id)}" aria-expanded="${open}"><span><b>${esc(p.name)}</b><div class="meta">${esc(p.base!=="Not found"?p.base:"Base not published")}${p.areas&&p.areas!=="Not found"?" · "+esc(p.areas):""}</div>
        <div class="badges">${vs.length?`<span class="badge b-list">On ${vs.length} venue list${vs.length>1?"s":""}</span>`:""}${inOpps?'<span class="badge b-idea">Also in Opportunities</span>':""}${mine?`<span class="badge b-mine">${esc(stLabel(mine))}</span>`:""}</div></span>${CHEV}</button>
      ${open?`<div class="acc-body">
        <div class="sec"><h5>Why it could be worth it</h5><p>${esc(p.why)}</p></div>
        ${vs.length?`<div class="sec"><h5>Venues where they show up</h5><div class="pchips">${vs.map(v=>`<button class="pchip" data-govenue="${esc(v.id)}">${esc(v.name)} →</button>`).join("")}</div></div>`:(p.venues&&p.venues!=="Not found"?`<div class="sec"><h5>Venues they mention</h5><p>${esc(p.venues)}</p></div>`:"")}
        <div class="sec"><h5>How to reach them</h5>${hasContact?reachHTML(p.contact,p.site):`<p class="small" style="margin-bottom:8px">No published contact found yet.</p>`}<div class="reach" style="margin-top:8px"><a class="btn btn-line btn-sm" href="${esc(lookup(p.name))}" target="_blank" rel="noopener">${icon.search}Look them up</a>${inOpps?`<a class="btn btn-line btn-sm" href="#/opps/${esc(p.main)}">Open in Opportunities</a>`:""}</div></div>
        ${msgBlock(p.id,p.name,base,p.contact.emails[0])}
        <div class="sec"><h5>Good to know</h5><ul class="mini"><li><span>Services</span><span>${esc(p.services)}</span></li></ul>
          <p class="srcs" style="margin-top:8px"><span class="small">Sources: </span>${srcLinks(p.sources)}</p></div>
        ${trackerHTML(p.id,p.name)}
      </div>`:""}</div>`;
  }
  function draw(){
    let html="", n=0, tot=0;
    if(f.view==="venues"){
      $("#bqFilters").innerHTML=`<div class="toolbar">${chipRow("town",[["all","All towns"]].concat(towns.map(t=>[t,t])),f.town)}<button class="chip" id="bqList" aria-pressed="${f.list}">Has a vendor list</button></div>`;
      const V=B.venues.filter(v=>(f.town==="all"||v.town===f.town)&&(!f.list||v.hasList)).sort((a,b)=>(b.connected-a.connected)||(b.hasList-a.hasList)||(b.new-a.new)||a.town.localeCompare(b.town)||a.name.localeCompare(b.name));
      n=V.length;tot=B.venues.length;html=`<div class="acc">${V.map(venueItem).join("")}</div>`+(!towns.includes("Erie")&&(f.town==="all")?`<p class="small" style="margin-top:14px">Nothing in Erie itself yet. We'll keep looking.</p>`:"");
      $("#bqFilters").querySelector('[data-f="town"]').onclick=e=>{const b=e.target.closest(".chip");if(!b)return;f.town=b.dataset.v;f.open="";draw();};
      $("#bqList").onclick=()=>{f.list=!f.list;f.open="";draw();};
      $("#bqRc").textContent=`${n} of ${tot} venues · tap one to open it`;
    }else if(f.view==="planners"){
      $("#bqFilters").innerHTML="";
      const P=B.planners.slice().sort((a,b)=>listCount(b)-listCount(a)||a.name.localeCompare(b.name));
      html=`<div class="acc">${P.map(plannerItem).join("")}</div>`;
      $("#bqRc").textContent=`${P.length} planners who show up on these venues' lists · tap one to open it`;
    }else{
      $("#bqFilters").innerHTML="";$("#bqRc").textContent="";
      html=`<ol class="steps">${(BC.steps||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
        <details class="fold" style="margin-top:16px"><summary>Starter message for a venue</summary><div class="fold-body"><div class="starter">${esc(BC.starters.venue)}</div><button class="btn btn-sm" data-cps="venue">${icon.copy}Copy</button></div></details>
        <details class="fold"><summary>Starter message for a planner</summary><div class="fold-body"><div class="starter">${esc(BC.starters.planner)}</div><button class="btn btn-sm" data-cps="planner">${icon.copy}Copy</button></div></details>`;
    }
    $("#bqBody").innerHTML=html;
    const body=$("#bqBody");
    body.querySelectorAll("[data-acc]").forEach(h=>h.onclick=()=>{const id=h.dataset.acc;f.open=f.open===id?"":id;history.replaceState(null,"",f.open?`#/boutique/${encodeURIComponent(f.open)}`:"#/boutique");draw();if(f.open){const el=document.getElementById("it-"+f.open);if(el){const y=el.getBoundingClientRect().top+scrollY-120;scrollTo({top:y,behavior:"smooth"});}}});
    body.querySelectorAll("[data-goplanner]").forEach(b=>b.onclick=()=>go("boutique",b.dataset.goplanner));
    body.querySelectorAll("[data-govenue]").forEach(b=>b.onclick=()=>go("boutique",b.dataset.govenue));
    body.querySelectorAll("[data-cps]").forEach(b=>b.onclick=()=>copy(BC.starters[b.dataset.cps],"Copied"));
    bindMsgs(body,bases);
    const it=f.open&&(vById(f.open)||pById(f.open));if(it)bindTrackerIn(body,it.name);
  }
  draw();
  if(f.open){const el=document.getElementById("it-"+f.open);if(el)setTimeout(()=>{const y=el.getBoundingClientRect().top+scrollY-120;scrollTo({top:y});},0);}
}

/* ============ MY LIST ============ */
const INFO_FIELDS=[
  ["name","Name you sign messages with","Orion"],["phone","Phone for messages","[phone]"],["email","Email for bookings",""],
  ["address","Mailing address for email footers","City is fine if you prefer"],["instagram","Instagram","@oriongiant"],
  ["price_wedding","Wedding pricing (4–6 hours)","e.g. $1,800–$2,600"],["price_event","Gala / private event pricing",""],["travel","Mountain travel (Vail, Breck) and fee",""],
  ["services","Services you offer","MC, ceremony audio, uplighting, silent disco…"],["insurance","Liability insurance / can you send a COI?",""],
  ["capacity","Biggest crowd your gear handles",""],["dates","Dates you're already booked or unavailable",""],["other","Anything else Anthony should know",""]];
function openId(id){if(/^b[vp]-/.test(id))go("boutique",id);else if(leadById(id))go("opps",id);else if(D.events.find(x=>x.id===id))go("calendar",id);else go("directory",id);}
function icsText(){
  const fold=s=>s.replace(/[\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  const ev=[];const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  Object.entries(T).filter(([,v])=>v.fu).forEach(([id,v])=>{const d=v.fu.replace(/-/g,""),e=addDays(v.fu,1).replace(/-/g,"");
    ev.push(["BEGIN:VEVENT",`UID:fu-${id}@orion-hub`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${e}`,`SUMMARY:${fold("Follow up: "+(v.name||id))}`,`DESCRIPTION:${fold((v.ch?"Reached out by "+v.ch+". ":"")+(v.n||""))}`,"END:VEVENT"].join("\r\n"));});
  D.content.timeline.filter(t=>t.date>=D.today).forEach((t,i)=>{const d=t.date.replace(/-/g,""),e=addDays(t.date,1).replace(/-/g,"");
    ev.push(["BEGIN:VEVENT",`UID:tl-${d}-${i}@orion-hub`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${e}`,`SUMMARY:${fold(t.title)}`,`DESCRIPTION:${fold(t.note+(t.url?" "+t.url:""))}`,"END:VEVENT"].join("\r\n"));});
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Cloudmann//Orion Hub//EN","CALSCALE:GREGORIAN",...ev,"END:VCALENDAR"].join("\r\n");
}
function saveFile(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function aiPack(){
  const L=[];
  L.push("# Orion (DJ/MC, Erie, Colorado) - my work notes","","You're helping me, Orion (@oriongiant), a DJ/MC based in Erie, Colorado, find and book larger weddings, galas and events around Denver, Boulder, Northern Colorado and the mountains. Use only the facts below; if something isn't here, say so instead of guessing. Write in a friendly, confident, specific voice and keep [brackets] for anything unknown.","");
  const info=INFO_FIELDS.filter(([k])=>P[k]).map(([k,l])=>`- ${l}: ${P[k]}`);
  L.push("## About me",...(info.length?info:["- (not filled in yet)"]),"");
  const mine=Object.entries(T).filter(([,v])=>v.s||v.n);
  L.push("## Where things stand");
  if(!mine.length)L.push("- Nothing marked yet.");
  STATUSES.filter(([k])=>k).forEach(([k,l])=>{const g=mine.filter(([,v])=>v.s===k);if(g.length){L.push(`### ${l}`);g.forEach(([,v])=>L.push(`- ${v.name}${v.ch?" (via "+v.ch+")":""}${v.fu?" - follow up "+v.fu:""}${v.why?" - why not: "+v.why:""}${v.n?" - notes: "+v.n.replace(/\s+/g," "):""}`));}});
  L.push("","## Opportunities (from my research hub)");
  D.leads.slice().sort((a,b)=>b.score-a.score).forEach(l=>{const d=D.content.drafts[l.id];L.push(`- **${l.name}** (${TYPE[l.type]||l.type}, ${l.city}). ${(d?d.angle:l.idea)||""} Facts: ${l.facts} Contact: ${l.contact.raw||"not found"}. Suggested timing: ${l.date||"-"}. Source: ${l.source}`);});
  const B=D.boutique;if(B&&B.venues.length){L.push("","## Boutique venues (50-150 guests, close to home)");B.venues.forEach(v=>L.push(`- **${v.name}** (${v.town}; ${v.size}). ${v.why} Getting on their list: ${v.list} Contact: ${v.contact.raw}`));
    L.push("","## Planners who work those venues");B.planners.forEach(p=>L.push(`- **${p.name}** (${p.base}). ${p.why} Contact: ${p.contact.raw||"not found"}`));}
  L.push("","## Upcoming dates");D.content.timeline.filter(t=>t.date>=D.today).forEach(t=>L.push(`- ${t.date}: ${t.title}. ${t.note}`));
  L.push("",`(Exported ${isoToday()} from the Orion Hub.)`);
  return L.join("\n");
}
function vMine(){
  S.mine=S.mine||"follow";
  const segs=[["follow","Follow-ups"],["marks","My marks"],["info","My info"]].concat(online()?[["suggest","Suggest a lead"]]:[]).concat([["tools","Tools"]]).concat(ADMIN?[["team","Team activity"]]:[]);
  if(!segs.some(s=>s[0]===S.mine))S.mine="follow";
  const fuCount=Object.values(T).filter(v=>v.fu&&v.fu<=addDays(isoToday(),7)).length;
  $("#view").innerHTML=`
  <div class="view-head"><div><h2>My list</h2><p>${online()?"Your marks, notes and info are saved to your account, so they're the same on your phone and computer. Anthony sees your updates automatically.":"Your marks and notes live in this browser on this device."}</p></div></div>
  <div class="toolbar"><div class="seg" id="mSeg">${segs.map(([k,l])=>`<button data-v="${k}" aria-pressed="${S.mine===k}">${l}${k==="follow"&&fuCount?` (${fuCount})`:""}</button>`).join("")}</div></div>
  <div id="mBody"></div>`;
  $("#mSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.mine=b.dataset.v;vMine();};
  const body=$("#mBody"), today=isoToday();
  const bindOpen=()=>body.querySelectorAll("[data-open]").forEach(a=>a.onclick=e=>{e.preventDefault();openId(a.dataset.open);});
  if(S.mine==="follow"){
    const F=Object.entries(T).filter(([,v])=>v.fu).sort((a,b)=>a[1].fu.localeCompare(b[1].fu));
    const grp=[["Overdue",F.filter(([,v])=>v.fu<today)],["This week",F.filter(([,v])=>v.fu>=today&&v.fu<=addDays(today,7))],["Later",F.filter(([,v])=>v.fu>addDays(today,7))]];
    body.innerHTML=F.length?grp.filter(([,g])=>g.length).map(([l,g])=>`<details class="fold" ${l!=="Later"?"open":""}><summary>${l} <small>${g.length}</small></summary><div class="fold-body"><ul class="kv">${g.map(([id,v])=>`<li class="fu-row"><span><a href="#" data-open="${esc(id)}"><b>${esc(v.name||id)}</b></a><span class="small">${esc(stLabel(v.s))}${v.ch?" via "+esc(v.ch):""} · follow up ${fmtDate(v.fu)} (${relDays(v.fu)})</span>${v.n?`<span class="small">${esc(v.n)}</span>`:""}</span><span class="fu-btns"><button class="btn btn-line btn-sm" data-fdone="${esc(id)}">Done</button><button class="btn btn-line btn-sm" data-fplus="${esc(id)}">+7 days</button></span></li>`).join("")}</ul></div></details>`).join("")
      :`<div class="empty">No follow-ups yet. When you mark something "Reached out", a follow-up a week later shows up here.</div>`;
    body.querySelectorAll("[data-fdone]").forEach(b=>b.onclick=()=>{T[b.dataset.fdone].fu="";saveT();toast("Follow-up cleared");vMine();});
    body.querySelectorAll("[data-fplus]").forEach(b=>b.onclick=()=>{const v=T[b.dataset.fplus];v.fu=addDays(v.fu<today?today:v.fu,7);saveT();toast("Moved to "+fmtDate(v.fu));vMine();});
    bindOpen();
  }else if(S.mine==="marks"){
    const items=Object.entries(T).filter(([,v])=>v.s||v.n);const group=k=>items.filter(([,v])=>(v.s||"")===k);
    body.innerHTML=items.length?STATUSES.filter(([k])=>k).concat([["","Notes only"]]).map(([k,l])=>{const g=group(k);if(!g.length)return"";return `<details class="fold"><summary>${l} <small>${g.length}</small></summary><div class="fold-body"><ul class="kv">${g.map(([id,v])=>`<li><a href="#" data-open="${esc(id)}"><b>${esc(v.name||id)}</b></a>${v.why?`<span class="small">Why not: ${esc(v.why)}</span><br>`:""}${v.n?`<span>${esc(v.n)}</span>`:""}${v.at?` <span class="small">· ${fmtDate(v.at)}</span>`:""}</li>`).join("")}</ul></div></details>`;}).join("")
      :`<div class="empty">Nothing here yet. Open any opportunity, gala, venue or planner and use "My notes" at the bottom to mark it.</div>`;
    bindOpen();
  }else if(S.mine==="info"){
    body.innerHTML=`<div class="panel"><p class="sub" style="color:var(--ink-2);margin-bottom:12px">These fill the [blanks] in message ideas (phone, email, address, services) and tell Anthony how to pitch you. Only you and Anthony can see them.</p>
      <form id="infoForm" class="form">${INFO_FIELDS.map(([k,l,ph])=>`<label><span>${esc(l)}</span>${["services","dates","other","price_event","travel"].includes(k)?`<textarea name="${k}" rows="2" placeholder="${esc(ph)}">${esc(P[k]||"")}</textarea>`:`<input name="${k}" value="${esc(P[k]||"")}" placeholder="${esc(ph)}">`}</label>`).join("")}
      <div class="msg-tools"><button class="btn" type="submit">Save my info</button><span class="small" id="infoMsg"></span></div></form></div>`;
    $("#infoForm").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);INFO_FIELDS.forEach(([k])=>{const v=String(fd.get(k)||"").trim().slice(0,1000);if(v)P[k]=v;else delete P[k];});
      $("#infoMsg").textContent="Saving…";const ok=await saveP();$("#infoMsg").textContent=ok?(online()?"Saved to your account.":"Saved on this device."):"Saved on this device. Couldn't reach the server, try again later.";};
  }else if(S.mine==="suggest"){
    body.innerHTML=`<div class="panel"><h3>Suggest a lead</h3><p class="sub" style="color:var(--ink-2)">Heard about a venue, planner or event? Drop it here and the next weekly research will look into it.</p>
      <textarea id="sgText" class="mynote" style="min-height:90px" placeholder="Name, town, and anything you know (a link helps)"></textarea>
      <div class="msg-tools"><button class="btn btn-sm" id="sgSend">Send to Anthony</button><span class="small" id="sgMsg"></span></div></div>
      <div class="panel" style="margin-top:14px"><h3>Your suggestions</h3><ul class="kv" id="sgList"><li class="small">Loading…</li></ul></div>`;
    const load=async()=>{const {data,error}=await SB.from("hub_suggestions").select("body,created_at,handled").eq("user_id",ME).order("created_at",{ascending:false}).limit(50);
      $("#sgList").innerHTML=error?`<li class="small">Couldn't load.</li>`:(data.length?data.map(s=>`<li><span>${esc(s.body)}</span><br><span class="small">${fmtDate(s.created_at.slice(0,10))} · ${s.handled?"looked into":"waiting for the next weekly research"}</span></li>`).join(""):`<li class="small">None yet.</li>`);};
    $("#sgSend").onclick=async()=>{const t=$("#sgText").value.trim();if(!t){$("#sgMsg").textContent="Type something first.";return;}
      const {error}=await SB.from("hub_suggestions").insert({user_id:ME,body:t.slice(0,3000)});$("#sgMsg").textContent=error?"Couldn't send. Check your connection and try again.":"Sent. Thanks!";if(!error){$("#sgText").value="";load();}};
    load();
  }else if(S.mine==="tools"){
    const nFu=Object.values(T).filter(v=>v.fu).length;
    body.innerHTML=`<div class="panel"><h3>Use your own AI</h3><p class="sub" style="color:var(--ink-2)">Copy everything (your info, where things stand, opportunities, venues, planners and dates) and paste it into ChatGPT, Claude, Gemini or any AI. Or save it as a file and upload it to a project there so it remembers. No setup needed.</p>
        <div class="msg-tools"><button class="btn btn-sm" id="aiCopy">${icon.copy}Copy for my AI</button><button class="btn btn-line btn-sm" id="aiFile">Save as a file</button></div>
        <p class="small" style="margin-top:8px">Try asking it: "Which three should I reach out to this week, and why?" or "Rewrite the Lyons RiverBend message shorter."</p></div>
      <div class="panel" style="margin-top:14px"><h3>Add dates to my calendar</h3><p class="sub" style="color:var(--ink-2)">Your ${nFu} follow-up${nFu===1?"":"s"} plus upcoming bridal shows and galas, as one calendar file. Open it on your phone or computer to add them.</p>
        <div class="msg-tools"><button class="btn btn-sm" id="icsBtn">Download calendar file</button></div></div>
      ${online()?"":`<div class="panel" style="margin-top:14px"><h3>Send an update</h3><p class="sub" style="color:var(--ink-2)">Copy what you've marked and text it to Anthony.</p><div class="msg-tools"><button class="btn btn-sm" id="exp">${icon.copy}Copy an update for Anthony</button></div></div>`}`;
    $("#aiCopy").onclick=()=>copy(aiPack(),"Copied. Paste it into your AI");
    $("#aiFile").onclick=()=>saveFile("orion-hub-notes.md",aiPack(),"text/markdown");
    $("#icsBtn").onclick=()=>saveFile("orion-hub-dates.ics",icsText(),"text/calendar");
    const ex=$("#exp");if(ex)ex.onclick=()=>{const items=Object.entries(T).filter(([,v])=>v.s||v.n);if(!items.length){toast("Nothing marked yet");return;}
      const lines=["Orion hub update – "+new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"}),""];
      STATUSES.filter(([k])=>k).forEach(([k,l])=>{const g=items.filter(([,v])=>v.s===k);if(g.length){lines.push(l+":");g.forEach(([,v])=>lines.push(`- ${v.name}${v.n?" ("+v.n.replace(/\s+/g," ").trim()+")":""}`));lines.push("");}});
      copy(lines.join("\n").trim(),"Update copied, paste it into a text or email");};
  }else if(S.mine==="team"){
    body.innerHTML=`<p class="small">Loading…</p>`;
    (async()=>{
      const [it,pe,sg,pr]=await Promise.all([SB.from("hub_items").select("*").neq("user_id",ME).order("updated_at",{ascending:false}).limit(500),
        SB.from("hub_people").select("*"),SB.from("hub_suggestions").select("*").order("created_at",{ascending:false}).limit(100),SB.from("hub_profile").select("*").neq("user_id",ME)]);
      if(it.error){body.innerHTML=`<div class="empty">Couldn't load team activity.</div>`;return;}
      const nm=id=>((pe.data||[]).find(p=>p.user_id===id)||{}).display_name||"Someone";
      const users=[...new Set([...(it.data||[]).map(r=>r.user_id),...(pr.data||[]).map(r=>r.user_id),...(sg.data||[]).filter(s=>s.user_id!==ME).map(s=>s.user_id)])];
      body.innerHTML=users.length?users.map(u=>{const rows=(it.data||[]).filter(r=>r.user_id===u&&(r.status||r.note));const prof=((pr.data||[]).find(r=>r.user_id===u)||{}).data||{};const sug=(sg.data||[]).filter(s=>s.user_id===u);
        return `<details class="fold" open><summary>${esc(nm(u))} <small>${rows.length} marked · ${sug.length} suggestion${sug.length===1?"":"s"}</small></summary><div class="fold-body">
          <ul class="kv">${rows.map(r=>`<li><b>${esc(r.item_name||r.item_id)}</b><span class="small">${esc(stLabel(r.status))}${r.channel?" via "+esc(r.channel):""}${r.follow_up?" · follow up "+fmtDate(r.follow_up):""} · updated ${fmtDate(r.updated_at.slice(0,10))}</span>${r.reason?`<br><span class="small">Why not: ${esc(r.reason)}</span>`:""}${r.note?`<br><span>${esc(r.note)}</span>`:""}</li>`).join("")||`<li class="small">Nothing marked yet.</li>`}</ul>
          ${sug.length?`<h4 style="margin:14px 0 6px">Suggestions</h4><ul class="kv">${sug.map(s=>`<li><span>${esc(s.body)}</span><br><span class="small">${fmtDate(s.created_at.slice(0,10))}${s.handled?" · handled":""}</span></li>`).join("")}</ul>`:""}
          <h4 style="margin:14px 0 6px">Their info</h4><ul class="kv">${INFO_FIELDS.map(([k,l])=>`<li><span class="small">${esc(l)}</span><br><span>${esc(prof[k]||"Not filled in")}</span></li>`).join("")}</ul></div></details>`;}).join("")
        :`<div class="empty">No activity from anyone else yet.</div>`;
    })();
  }
}
